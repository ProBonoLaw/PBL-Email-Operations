apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-hub
  namespace: email-operations
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: communication-hub }
  template:
    metadata:
      labels: { app: communication-hub, azure.workload.identity/use: "true" }
      annotations:
        checksum/email-branding: "<email-branding-checksum>"
    spec:
      serviceAccountName: email-operations
      terminationGracePeriodSeconds: 240
      containers:
        - name: worker
          image: <registry>/email-operations:latest
          envFrom:
            - configMapRef: { name: email-operations-config }
            - configMapRef: { name: email-branding }
          env:
            - { name: ROLE, value: communication-hub }
            - { name: EVENTHUB_NAME, value: "<communication-eventhub-name>" }
            - { name: EVENTHUB_CONSUMER_GROUP, value: "<communication-consumer-group>" }
          volumeMounts:
            - { name: appsettings, mountPath: /mnt/keyvault, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: appsettings
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: email-operations-appsettings }
---
