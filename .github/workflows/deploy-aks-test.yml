name: Deploy Email Operations to AKS test

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag from a successful main build (sha-<commit>)
        required: true
        type: string
      activate:
        description: Start workers and unsuspend identification after applying manifests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.TEST_ENVIRONMENT_ENABLED == 'true' && (vars.DEPLOYMENT_ENABLED == 'true' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: aks-test
    concurrency:
      group: email-operations-aks-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Load private deployment settings
        env:
          DEPLOYMENT_CONFIG: ${{ secrets.DEPLOYMENT_CONFIG }}
        run: |
          test -n "$DEPLOYMENT_CONFIG" || { echo 'DEPLOYMENT_CONFIG is required'; exit 1; }
          bash scripts/deployment-settings.sh --github-env
      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Apply test manifests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ACTIVATE: ${{ inputs.activate && '1' || '0' }}
        run: bash scripts/deploy-aks-test.sh
